databaseChangeLog:
  - changeSet:
      id: 005-create-user
      author: nikita
      changes:
        - createSequence:
            sequenceName: user_seq
            incrementBy: 50
            startValue: 1
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: varchar(255)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: password
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: varchar(255)
                  constraints:
                    nullable: false